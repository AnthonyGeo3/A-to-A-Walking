                                <span class="text-gray-400 ml-1 cursor-pointer hover:underline edit-date" data-id="${l.id}" data-date="${l.date.toDate().toISOString().split('T')[0]}">${date}</span>
                                ${l.note ? `<div class="text-gray-600 italic">"${l.note}"</div>` : ''}
                                ${l.locationName ? `<div class="text-gray-500 truncate max-w-[140px] sm:max-w-[180px] show-location cursor-pointer hover:underline" data-loc="${(l.locationName || '').replace(/"/g, '&quot;')}">📍 ${l.locationName}</div>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-1 flex-shrink-0">
                            <button class="text-amber-400 hover:text-amber-600 edit-photo" data-id="${l.id}" title="${l.photoUrl ? 'Change photo' : 'Add photo'}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            </button>
                            <button class="text-gray-400 hover:text-gray-600 edit-loc" data-id="${l.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            </button>
                            <button class="text-blue-400 hover:text-blue-600 edit-note" data-id="${l.id}" data-note="${l.note||''}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                            </button>
                            <button class="text-red-400 hover:text-red-600 del-log" data-id="${l.id}" data-steps="${l.steps}" data-uid="${uid}"${photoPathAttr}>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>
                    `;
                    el.appendChild(div);
                });
            });
        }

        // Has this person logged anything dated today? Used to decide whether today
        // should count towards the daily average — otherwise the average sags all day
        // and only recovers when we log at bedtime.
        function hasLoggedToday(userKey) {
            const now = new Date();
            return logData.some(log => {
                if (log.userId !== userKey || !log.date) return false;
                const d = log.date.toDate();
                return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
        }

        // All-time daily average for a user. Uses the same "don't count today until it's
        // logged" rule as the stats panel. Returns 0 if there's nothing to go on yet.
        function getDailyAverage(userKey) {
            if (!userData[userKey]) return 0;
            const challengeStart = new Date(2025, 9, 1);
            let days = Math.floor(Math.max(0, new Date() - challengeStart) / 86400000) + 1;
            if (!hasLoggedToday(userKey)) days -= 1;
            days = Math.max(1, days);
            return totalSteps(userKey) / days;
        }

        // Days elapsed in a challenge year, capped at the year's length once it's over.
        function daysElapsedInChallengeYear(n, countToday) {
            const start = challengeYearStart(n);
            const end = challengeYearEnd(n);
            const now = new Date();
            const upTo = now < end ? now : new Date(end.getTime() - 86400000);
            let days = Math.floor((startOfDay(upTo) - start) / 86400000) + 1;
            if (now < end && !countToday) days -= 1;
            return Math.max(1, days);
        }

        function calculateAndRenderStats() {
            const filterValue = statsFilter.value;
            const today = new Date();
            const thisYear = currentChallengeYear();

            ['user1', 'user2'].forEach(userKey => {
                if (!userData[userKey]) return;
                const userLogs = logData.filter(log => log.userId === userKey);
                const countToday = hasLoggedToday(userKey);
                const isAnt = userKey === 'user1';
                const colour = isAnt ? 'green' : 'purple';
                const name = userData[userKey].name;

                let headlineLabel, headlineValue, subLabel, subValue, predLabel, predValue;

                if (filterValue === 'all') {
                    // Headline is the *year* average — the annual journey is the hero now.
                    const yearDays = daysElapsedInChallengeYear(thisYear, countToday);
                    headlineLabel = `${name} Year Avg`;
                    headlineValue = Math.round(annualSteps[userKey] / yearDays);

                    // All-time average, using the same "don't count today until it's logged" rule.
                    const allDays = Math.max(1, Math.floor((startOfDay(today) - CHALLENGE_START) / 86400000) + 1 - (countToday ? 0 : 1));
                    subLabel = 'All-time Avg';
                    subValue = Math.round(totalSteps(userKey) / allDays);

                    predLabel = 'Year Prediction';
                    predValue = Math.round((annualSteps[userKey] / yearDays) * 365);
                } else if (filterValue.startsWith('year-')) {
                    const n = parseInt(filterValue.split('-')[1], 10);
                    const total = stepsInChallengeYear(userKey, n);
                    const days = daysElapsedInChallengeYear(n, countToday);
                    headlineLabel = `${name} · Year ${n} Avg`;
                    headlineValue = Math.round(total / days);
                    subLabel = `Year ${n} Total`;
                    subValue = total;
                    predLabel = 'Year Prediction';
                    predValue = Math.round((total / days) * 365);
                } else {
                    const [yearStr, monthStr] = filterValue.split('-');
                    const year = parseInt(yearStr), month = parseInt(monthStr);
                    const total = userLogs.reduce((sum, log) => {
                        const d = log.date.toDate();
                        return (d.getFullYear() === year && d.getMonth() === month) ? sum + log.steps : sum;
                    }, 0);
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    let divisor = daysInMonth;
                    if (year === today.getFullYear() && month === today.getMonth()) {
                        divisor = countToday ? today.getDate() : today.getDate() - 1;
                    }
                    divisor = Math.max(1, divisor);
                    headlineLabel = `${name} Daily Avg`;
                    headlineValue = Math.round(total / divisor);
                    subLabel = 'Month Total';
                    subValue = total;
                    predLabel = 'Month Prediction';
                    predValue = Math.round((total / divisor) * daysInMonth);
                }

                // "vs year 1" — same point in the year, this year against last.
                let pill = '';
                if (filterValue === 'all' && thisYear > 1 && ghostSteps[userKey] > 0) {
                    const diff = ((annualSteps[userKey] - ghostSteps[userKey]) / ghostSteps[userKey]) * 100;
                    const up = diff >= 0;
                    pill = `<div class="mt-2">
                        <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${up ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}"
                              title="This year so far vs the same point in year ${thisYear - 1}">
                            ${up ? '↑' : '↓'} ${Math.abs(diff).toFixed(0)}% vs year ${thisYear - 1}
                        </span>
                    </div>`;
                }

                const card = document.getElementById(`${userKey}-stats-card`);
                if (!card) return;
                card.innerHTML = `
                    <p class="text-[10px] uppercase font-bold text-${colour}-700">${headlineLabel}</p>
                    <p class="text-${colour}-600 font-bold text-xl leading-tight">${headlineValue.toLocaleString()}</p>
                    <p class="text-[10px] text-gray-400 mt-1">${subLabel} · <span class="text-gray-500 font-semibold">${subValue.toLocaleString()}</span></p>
                    <p class="text-[10px] text-gray-400">${predLabel} · <span class="text-gray-500 font-semibold">${predValue.toLocaleString()}</span></p>
                    ${pill}
                `;
            });
        }

        let heatmapMonthName = '';
        function renderHeatmap() {
            const container = document.getElementById('heatmap-container');
            const filterValue = document.getElementById('stats-filter').value;
            const today = new Date();

            let year, month;
            if (filterValue === 'all') {
                year = today.getFullYear();
                month = today.getMonth();
            } else if (filterValue.startsWith('year-')) {
                // The heatmap is a month view, so for a whole-year filter show the current
                // month if we're inside that year, otherwise the year's final month (Sep).
                const n = parseInt(filterValue.split('-')[1], 10);
                if (getChallengeYear(today) === n) {
                    year = today.getFullYear();
                    month = today.getMonth();
                } else {
                    year = CHALLENGE_START_YEAR + n;
                    month = 8; // September
                }
            } else {
                const parts = filterValue.split('-');
                year = parseInt(parts[0]);
                month = parseInt(parts[1]);
            }

            // Build per-day step totals for each user
            const dayTotals = { user1: {}, user2: {} };
            logData.forEach(log => {
                const d = log.date.toDate();
                if (d.getFullYear() === year && d.getMonth() === month) {
                    const day = d.getDate();
                    dayTotals[log.userId][day] = (dayTotals[log.userId][day] || 0) + log.steps;
                }
            });

            // Find max steps in month for intensity scaling
            const allValues = [...Object.values(dayTotals.user1), ...Object.values(dayTotals.user2)];
            const maxSteps = Math.max(...allValues, 1);

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayOfWeek = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0
            const monthName = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

            const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

            let html = `<p class="text-xs font-semibold text-gray-500 text-center mb-2">${monthName}</p>`;
            html += '<div class="grid grid-cols-2 gap-3">';

            ['user1', 'user2'].forEach(uid => {
                const color = uid === 'user1' ? 'green' : 'purple';
                const rgb = uid === 'user1' ? '34, 197, 94' : '168, 85, 247';
                const name = uid === 'user1' ? 'Ant' : 'Amy';

                html += `<div>`;
                html += `<p class="text-[10px] font-bold text-${color}-600 text-center mb-1">${name}</p>`;
                html += '<div class="heatmap-grid">';

                // Day headers
                dayLabels.forEach(d => { html += `<div class="heatmap-day-header">${d}</div>`; });

                // Empty cells before first day
                for (let i = 0; i < firstDayOfWeek; i++) {
                    html += '<div class="heatmap-cell"></div>';
                }

                // Day cells
                for (let d = 1; d <= daysInMonth; d++) {
                    const steps = dayTotals[uid][d] || 0;
                    const intensity = steps > 0 ? Math.max(0.15, Math.min(1, steps / maxSteps)) : 0;
                    const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                    const bg = steps > 0 ? `rgba(${rgb}, ${intensity})` : '#f3f4f6';
                    const border = isToday ? `border: 1.5px solid rgba(${rgb}, 0.8);` : '';
                    const textColor = intensity > 0.5 ? 'color: white;' : 'color: #9ca3af;';
                    const title = steps > 0 ? `${steps.toLocaleString()} steps` : 'No steps';

                    html += `<div class="heatmap-cell" style="background: ${bg}; ${border} ${textColor} cursor: pointer;" data-steps="${steps}" data-day="${d}" data-name="${name}">${d}</div>`;
                }

                html += '</div></div>';
            });

            html += '</div>';
            container.innerHTML = html;
            heatmapMonthName = monthName;

            // Tap to show step count on mobile. Bound once — the container survives every
            // re-render, so re-binding here would stack a new listener each time.
            if (!container.dataset.tapBound) {
                container.dataset.tapBound = '1';
                const tapInfo = document.getElementById('heatmap-tap-info');
                container.addEventListener('click', e => {
                    const cell = e.target.closest('.heatmap-cell');
                    if (!cell || !cell.dataset.day) return;
                    const steps = parseInt(cell.dataset.steps);
                    tapInfo.textContent = steps > 0
                        ? `${cell.dataset.name} · ${cell.dataset.day} ${heatmapMonthName} · ${steps.toLocaleString()} steps`
                        : `${cell.dataset.name} · ${cell.dataset.day} ${heatmapMonthName} · No steps`;
                });
            }
        }

        function renderRivalry() {
            const container = document.getElementById('rivalry-container');
            if (!container) return;

            const today = new Date();
            // Monday-as-start-of-week: getDay() returns 0=Sun..6=Sat → remap to Mon=0..Sun=6
            const dayOfWeek = (today.getDay() + 6) % 7;
            const weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - dayOfWeek);
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

            let weekAnt = 0, weekAmy = 0, monthAnt = 0, monthAmy = 0;
            logData.forEach(log => {
                const d = log.date.toDate();
                if (d > today) return;
                if (d >= monthStart) {
                    if (log.userId === 'user1') monthAnt += log.steps;
                    else if (log.userId === 'user2') monthAmy += log.steps;
                }
                if (d >= weekStart) {
                    if (log.userId === 'user1') weekAnt += log.steps;
                    else if (log.userId === 'user2') weekAmy += log.steps;
                }
            });

            const monthName = today.toLocaleString('default', { month: 'long' });

            // Days done / days left in the challenge year — the number that actually
            // matters when you're chasing a target by 30 Sep.
            const yr = currentChallengeYear();
            const yrStart = challengeYearStart(yr), yrEnd = challengeYearEnd(yr);
            const daysDone = Math.floor((startOfDay(today) - yrStart) / 86400000) + 1;
            const daysLeft = Math.max(0, Math.round((yrEnd - startOfDay(today)) / 86400000) - 1);
            const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;

            container.innerHTML = `
                <h3 class="text-sm font-bold text-gray-700 text-center mb-3 mt-4">⚔️ Head to Head</h3>
                ${rivalryBarHtml('This week (Mon–Sun)', weekAnt, weekAmy)}
                ${rivalryBarHtml(`This month (${monthName})`, monthAnt, monthAmy)}
                ${rivalryBarHtml(`This year (${plural(daysDone, 'day')} done, ${plural(daysLeft, 'day')} left)`, annualSteps.user1, annualSteps.user2)}
            `;
        }

        function rivalryBarHtml(label, antSteps, amySteps) {
            const total = antSteps + amySteps;
            const antPct = total > 0 ? (antSteps / total) * 100 : 0;
            const amyPct = total > 0 ? (amySteps / total) * 100 : 0;
            // Use rounded values for display so they sum to 100 exactly
            const antPctDisp = total > 0 ? Math.round(antPct) : 0;
            const amyPctDisp = total > 0 ? 100 - antPctDisp : 0;

            let antCrown = '', amyCrown = '';
            if (total > 0) {
                if (antSteps > amySteps) antCrown = ' 👑';
                else if (amySteps > antSteps) amyCrown = '👑 ';
            }

            return `
                <div class="mb-3 last:mb-0">
                    <p class="text-xs font-semibold text-gray-500 text-center mb-1">${label}</p>
                    <div class="rivalry-track">
                        <div class="rivalry-fill-ant" style="width: ${antPct}%"></div>
                        <div class="rivalry-fill-amy" style="width: ${amyPct}%"></div>
                    </div>
                    <div class="flex justify-between text-xs mt-1.5">
                        <span class="text-green-700 font-semibold">Ant · ${antSteps.toLocaleString()} (${antPctDisp}%)${antCrown}</span>
                        <span class="text-purple-700 font-semibold">${amyCrown}Amy · ${amySteps.toLocaleString()} (${amyPctDisp}%)</span>
                    </div>
                </div>
            `;
        }

        // --- 🕰️ "A year ago today" ---

        const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        // A log only counts as a memory if there's something to actually look back at.
        const isMemorable = (l) => !!(l && (l.note || l.photoUrl || l.locationName));

        // Note first, then location, then just the step count.
        function memoryBlurb(l) {
            if (l.note) return `"${esc(l.note)}"`;
            if (l.locationName) return `📍 ${esc(l.locationName)}`;
            return `${l.steps.toLocaleString()} steps`;
        }

        // Stable pseudo-random from the date, so the "fair pick" between Ant and Amy
        // doesn't flip on every re-render — but does change from one day to the next.
        function dateSeed(d) {
            const s = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            let h = 0;
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        // One entry per previous challenge year: that person's memorable log from exactly
        // this date, a year (or two, or three) ago. No fuzzy window — it either happened
        // on this day or it didn't.
        function collectMemories() {
            const today = startOfDay(new Date());
            const yearsBack = Math.max(0, currentChallengeYear() - 1);
            const candidates = logData.filter(l => l.date && isMemorable(l));
            const out = [];

            for (let k = 1; k <= yearsBack; k++) {
                const target = new Date(today);
                target.setFullYear(target.getFullYear() - k);
                const picks = {};

                ['user1', 'user2'].forEach(uid => {
                    let best = null;
                    candidates.forEach(l => {
                        if (l.userId !== uid) return;
                        if (startOfDay(l.date.toDate()).getTime() !== target.getTime()) return;
                        // More than one log on the same day: the bigger one wins.
                        if (!best || l.steps > best.steps) best = l;
                    });
                    if (best) picks[uid] = best;
                });

                if (picks.user1 || picks.user2) out.push({ yearsAgo: k, target, picks });
            }
            return out;
        }

        function memoryCardHtml(log) {
            const isAnt = log.userId === 'user1';
            const d = log.date.toDate();
            return `
                <div class="text-left border rounded-lg p-3 mb-3 last:mb-0 ${isAnt ? 'card-ant' : 'card-amy'}">
                    <div class="flex justify-between items-baseline mb-1">
                        <span class="font-bold text-sm ${isAnt ? 'text-green-700' : 'text-purple-700'}">${esc(userData[log.userId].name)}</span>
                        <span class="text-[10px] text-gray-400">${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                    </div>
                    ${log.photoUrl ? `<img src="${esc(log.photoUrl)}" alt="" class="w-full rounded-md mb-2" />` : ''}
                    ${log.note ? `<p class="text-sm text-gray-700 italic mb-1">"${esc(log.note)}"</p>` : ''}
                    ${log.locationName ? `<p class="text-xs text-gray-500 mb-1">📍 ${esc(log.locationName)}</p>` : ''}
                    <p class="text-xs font-semibold ${isAnt ? 'text-green-600' : 'text-purple-600'}">${log.steps.toLocaleString()} steps</p>
                </div>`;
        }

        function renderMemories() {
            const strip = document.getElementById('memories-strip');
            if (!strip) return;
            const memories = collectMemories();

            if (!memories.length) {
                strip.classList.add('hidden');
                strip.innerHTML = '';
                return;
            }

            // The strip teases the most recent year; the modal shows everything.
            const latest = memories[0];
            const both = latest.picks.user1 && latest.picks.user2;
            const seedPick = dateSeed(new Date()) % 2 === 0 ? 'user1' : 'user2';
            const shownUid = both ? seedPick : (latest.picks.user1 ? 'user1' : 'user2');
            const shown = latest.picks[shownUid];

            const yearsLabel = latest.yearsAgo === 1 ? 'A year ago today' : `${latest.yearsAgo} years ago today`;
            const anyPhoto = Object.values(latest.picks).some(l => l.photoUrl);

            strip.classList.remove('hidden');
            strip.innerHTML = `
                <div class="memory-strip">
                    <span class="text-sm">${anyPhoto ? '📷' : '🕰️'}</span>
                    <span class="memory-text"><span class="font-semibold not-italic">${yearsLabel}</span> · ${esc(userData[shownUid].name)}: ${memoryBlurb(shown)}</span>
                    <span class="text-[#b08d57] text-sm">›</span>
                </div>`;

            strip.querySelector('.memory-strip').addEventListener('click', () => {
                const body = memories.map(mem => {
                    const cards = ['user1', 'user2'].filter(u => mem.picks[u]).map(u => memoryCardHtml(mem.picks[u])).join('');
                    const heading = memories.length > 1
                        ? `<p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">${mem.target.getFullYear()}</p>`
                        : '';
                    return heading + cards;
                }).join('');
                showModal(yearsLabel, `<div class="max-h-[60vh] overflow-y-auto">${body}</div>`, () => {}, 'Close');
            });
        }

        function renderMap() {
            if (!map || !markers) return;
            markers.clearLayers();

            // Count how many logs share each ~100m location bucket, so we can
            // scatter duplicates instead of stacking them on top of each other.
            const locationCounts = {};
            logData.forEach(log => {
                if (log.lat && log.lng) {
                    const key = `${log.lat.toFixed(3)},${log.lng.toFixed(3)}`;
                    locationCounts[key] = (locationCounts[key] || 0) + 1;
                }
            });

            // Deterministic offset from the log id, so the same log always lands
            // on the same spot — pins don't jump around on re-renders.
            const offsetForId = (id, radius) => {
                let h = 0;
                for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
                const angle = ((h & 0xffff) / 0x10000) * Math.PI * 2;
                const dist = (((h >>> 16) & 0xffff) / 0x10000) * radius;
                return { dLat: Math.sin(angle) * dist, dLng: Math.cos(angle) * dist };
            };

            logData.forEach(log => {
                if(log.lat && log.lng) {
                    const isAnt = log.userId === 'user1';
                    const iconClass = isAnt ? 'marker-icon-ant' : 'marker-icon-amy';

                    // If multiple logs share this spot (e.g. the local park),
                    // scatter them inside a ~55m circle so they're clickable when zoomed in.
                    let lat = log.lat;
                    let lng = log.lng;
                    const key = `${log.lat.toFixed(3)},${log.lng.toFixed(3)}`;
                    if (locationCounts[key] > 1) {
                        const { dLat, dLng } = offsetForId(log.id, 0.0005);
                        lat += dLat;
                        lng += dLng;
                    }

                    // If the log has a photo, build a divIcon that shows the thumbnail
                    // inside a coloured pin. Otherwise fall back to the coloured Leaflet pin.
                    let icon;
                    if (log.photoUrl) {
                        icon = L.divIcon({
                            html: `<div class="photo-pin ${isAnt ? '' : 'amy'}"><img src="${log.photoUrl}" alt="" /></div>`,
                            className: 'photo-pin-wrap', // combined with .leaflet-div-icon — we override its styles
                            iconSize: [44, 54],          // 44 circle + 10 tail
                            iconAnchor: [22, 54],
                            popupAnchor: [0, -54]
                        });
                    } else {
                        icon = L.icon({
                            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                            iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41],
                            className: iconClass // Apply CSS filter for color
                        });
                    }

                    const marker = L.marker([lat, lng], { icon: icon });
                    
                    // Simplify location text to first comma
                    const shortLocation = log.locationName ? log.locationName.split(',')[0] : '';
                    
                    // Improved compact popup structure
                    const popupContent = `
                        <div class="text-sm font-sans">
                            <div class="font-bold flex items-center gap-1 mb-1 border-b pb-1">
                                <span class="${isAnt ? 'text-green-600' : 'text-purple-600'} text-base">${isAnt ? USER_1_NAME : USER_2_NAME}</span>
                                <span class="text-gray-400 mx-1">•</span>
                                <span>${log.steps.toLocaleString()}</span>
                                <span class="text-gray-400 mx-1">•</span>
                                <span class="text-gray-500 font-normal">${log.date.toDate().toLocaleDateString('en-GB', {day:'numeric', month:'short'})}</span>
                            </div>

                            ${log.note ? `<div class="italic text-gray-700 mb-1">"${log.note}"</div>` : ''}
                            ${shortLocation ? `<div class="text-gray-500 text-xs flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg> ${shortLocation}</div>` : ''}
                            ${log.photoUrl ? `<img src="${log.photoUrl}" class="popup-photo" data-id="${log.id}" data-url="${log.photoUrl}" alt="Log photo" />` : ''}
                        </div>`;
                    
                    marker.bindPopup(popupContent, { maxWidth: 220 });
                    markers.addLayer(marker);
                }
            });
        }

        // A stretch goal's optional deadline, stored as a plain 'YYYY-MM-DD' string.
        // Parsed by hand rather than with `new Date(str)`, which reads a bare date as UTC
        // midnight and so lands on the day before once it's shown west of Greenwich.
        function parseTargetDate(str) {
            if (typeof str !== 'string') return null;
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str.trim());
            if (!m) return null;
            const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            return isNaN(d.getTime()) ? null : d;
        }

        // "By 30 Sep 2026 · 12,345 a day needed" — the second line on a goal that has a
        // deadline set. Empty string when it hasn't, so the card looks exactly as before.
        // Today counts as a day you can still walk in, unless it's already logged — the
        // same rule the stats panel uses, and the one that keeps this honest against a
        // remaining total that already includes today.
        function targetDateText(uid, g) {
            const target = parseTargetDate(g.targetDate);
            if (!target) return '';
            const dateStr = target.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const today = startOfDay(new Date());
            if (target < today) return `By ${dateStr} &middot; that date has passed`;

            let days = Math.floor((target - today) / 86400000) + 1;
            if (hasLoggedToday(uid)) days -= 1;
            if (days < 1) return `By ${dateStr} &middot; due today`;

            const remaining = Math.max(0, g.steps - totalSteps(uid));
            if (remaining === 0) return `By ${dateStr} &middot; already there`;
            const perDay = Math.ceil(remaining / days);
            return `By ${dateStr} &middot; ${perDay.toLocaleString()} a day needed`;
        }

        // "X days to go" at the current daily average, plus the date that lands on.
        function daysToGoalText(uid, g) {
            const avg = getDailyAverage(uid);
            const remaining = Math.max(0, g.steps - totalSteps(uid));
            if (avg <= 0) return 'Log some steps to see an ETA';
            const days = Math.ceil(remaining / avg);
            if (days > 3650) return 'Over 10 years at this pace 😅';
            const eta = new Date();
            eta.setDate(eta.getDate() + days);
            const etaStr = eta.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            return `${days.toLocaleString()} day${days === 1 ? '' : 's'} to go &middot; ~${etaStr}`;
        }

        function renderStretch() {
            const div = document.getElementById('stretch-goals-container');
            div.innerHTML = '';
            // End of the *current* challenge year, so this keeps working after 1 Oct 2026.
            const end = challengeYearEnd(currentChallengeYear());
            const daysLeft = Math.max(1, Math.ceil((end - new Date())/86400000));
            
            SHARED_STRETCH.forEach(g => {
                const done = totalSteps('user1') >= g.steps && totalSteps('user2') >= g.steps;
                const rem1 = Math.max(0, g.steps - totalSteps('user1')), rem2 = Math.max(0, g.steps - totalSteps('user2'));
                div.innerHTML += `<div class="bg-white p-3 rounded border-l-4 ${done?'border-amber-400 bg-amber-50':'border-gray-200'} shadow-sm flex justify-between">
                    <div><div class="font-bold text-sm">${g.label}</div><div class="text-xs text-gray-500">${g.steps.toLocaleString()} each</div>
                    ${!done ? `<div class="text-[10px] mt-1">Daily: <span class="text-green-600">${Math.ceil(rem1/daysLeft)}</span> | <span class="text-purple-600">${Math.ceil(rem2/daysLeft)}</span></div>` : ''}
                    </div><div class="text-xl">${g.reward}</div></div>`;
            });
            ['user1','user2'].forEach(uid => {
                const g = getStretch(uid);
                const done = totalSteps(uid) >= g.steps;
                const rem = Math.max(0, g.steps - totalSteps(uid));
                const editing = stretchEditing === uid;
                const f = editing && stretchDraft ? stretchDraft : g;
                div.innerHTML += `<div class="bg-white p-3 rounded border-l-4 ${done?'border-amber-400 bg-amber-50':'border-gray-200'} shadow-sm">
                    <div class="flex justify-between items-start">
                        <div><div class="font-bold text-sm">${g.label} (${userData[uid].name})</div><div class="text-xs text-gray-500">${g.steps.toLocaleString()}</div>
                        ${!done ? `<div class="text-[10px] mt-1 text-${uid==='user1'?'green':'purple'}-600">${daysToGoalText(uid, g)}</div>
                        ${targetDateText(uid, g) ? `<div class="text-[10px] mt-0.5 text-gray-500">${targetDateText(uid, g)}</div>` : ''}` : `<div class="text-[10px] mt-1 text-amber-600 font-bold">Smashed it! 🎉</div>`}
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="text-xl">${g.reward}</div>
                            <button class="stretch-edit-btn text-gray-400 hover:text-gray-700 text-xs leading-none p-1" data-uid="${uid}" title="Edit goal">✏️</button>
                        </div>
                    </div>
                    ${editing ? `
                    <div class="mt-3 pt-3 border-t border-gray-200 space-y-2">
                        <input type="text" class="stretch-f-label w-full text-sm border rounded px-2 py-1" placeholder="What are you working towards?" value="${String(f.label).replace(/"/g,'&quot;')}" maxlength="40" />
                        <div class="flex gap-2">
                            <input type="number" class="stretch-f-steps flex-1 text-sm border rounded px-2 py-1" placeholder="Steps" value="${f.steps}" min="1" step="1000" />
                            <input type="text" class="stretch-f-reward w-16 text-sm border rounded px-2 py-1 text-center" placeholder="🎁" value="${String(f.reward).replace(/"/g,'&quot;')}" maxlength="4" />
                        </div>
                        <div class="flex gap-2 items-center">
                            <label class="text-[10px] text-gray-500 whitespace-nowrap">By (optional)</label>
                            <input type="date" class="stretch-f-date flex-1 text-sm border rounded px-2 py-1" value="${parseTargetDate(f.targetDate) ? f.targetDate : ''}" />
                            ${parseTargetDate(f.targetDate) ? `<button type="button" class="stretch-clear-date text-[10px] text-gray-400 hover:text-gray-700 underline px-1">clear</button>` : ''}
                        </div>
                        <div class="flex gap-2 justify-end">
                            <button class="stretch-cancel-btn text-xs px-3 py-1 rounded bg-gray-100 text-gray-600">Cancel</button>
                            <button class="stretch-save-btn text-xs px-3 py-1 rounded bg-${uid==='user1'?'green':'purple'}-600 text-white font-bold" data-uid="${uid}">Save</button>
                        </div>
                    </div>` : ''}
                </div>`;
            });

            div.querySelectorAll('.stretch-edit-btn').forEach(btn => {
                btn.onclick = () => {
                    const uid = btn.dataset.uid;
                    stretchEditing = uid;
                    stretchDraft = { ...getStretch(uid) };
                    renderStretch();
                };
            });
            div.querySelectorAll('.stretch-cancel-btn').forEach(btn => {
                btn.onclick = () => { stretchEditing = null; stretchDraft = null; renderStretch(); };
            });
            const readStretchForm = (card) => ({
                label: card.querySelector('.stretch-f-label').value,
                steps: parseInt(card.querySelector('.stretch-f-steps').value, 10) || 0,
                reward: card.querySelector('.stretch-f-reward').value,
                targetDate: card.querySelector('.stretch-f-date').value
            });
            // Keep the draft in sync so a background Firestore update can't wipe what's being typed
            div.querySelectorAll('.stretch-f-label, .stretch-f-steps, .stretch-f-reward, .stretch-f-date').forEach(inp => {
                inp.oninput = () => { stretchDraft = readStretchForm(inp.closest('div.bg-white')); };
            });
            // Date inputs are awkward to empty by hand, especially on a phone, so give the
            // "leave it blank for no deadline" case a button of its own.
            div.querySelectorAll('.stretch-clear-date').forEach(btn => {
                btn.onclick = () => {
                    stretchDraft = { ...readStretchForm(btn.closest('div.bg-white')), targetDate: '' };
                    renderStretch();
                };
            });
            div.querySelectorAll('.stretch-save-btn').forEach(btn => {
                btn.onclick = async () => {
                    const card = btn.closest('div.bg-white');
                    const form = readStretchForm(card);
                    const label = form.label.trim();
                    const steps = form.steps;
                    const reward = form.reward.trim();
                    if (!label || !steps || steps < 1) { alert('Give it a name and a step target!'); return; }
                    // Left blank, the key is simply left off — which is also how an existing
                    // deadline gets removed, since this replaces the whole `stretch` map.
                    const stretch = { label, steps, reward: reward || '🎯' };
                    if (parseTargetDate(form.targetDate)) stretch.targetDate = form.targetDate;
                    btn.disabled = true; btn.textContent = 'Saving...';
                    try {
                        const ref = btn.dataset.uid === 'user1' ? user1DocRef : user2DocRef;
                        await updateDoc(ref, { stretch });
                        stretchEditing = null; stretchDraft = null;
                    } catch (e) {
                        console.error(e); alert('Could not save that — try again?');
                        btn.disabled = false; btn.textContent = 'Save';
                    }
                };
            });
        }

        function renderHighScores() {
            const medals = ['🥇', '🥈', '🥉'];
            ['user1','user2'].forEach(uid => {
                const uLogs = logData.filter(l => l.userId === uid).sort((a, b) => b.steps - a.steps);
                const top3 = uLogs.slice(0, 3);
                const color = uid === 'user1' ? 'green' : 'purple';
                const name = uid === 'user1' ? 'Ant' : 'Amy';
                const el = document.getElementById(`${uid}-highscore`);

                if (top3.length === 0) {
                    el.innerHTML = '<div class="text-center text-xs text-gray-400 italic py-4">No Data Yet</div>';
                    return;
                }

                let html = `<div class="space-y-2">`;
                top3.forEach((entry, i) => {
                    const dateStr = entry.date.toDate().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                    const isGold = i === 0;
                    const bg = isGold ? 'bg-amber-50 border-amber-300' : 'bg-gray-50 border-gray-200';
                    const border = isGold ? 'border-2' : 'border';

                    let detail = '';
                    if (entry.note) detail = `<span class="text-gray-500 italic"> "${entry.note}"</span>`;
                    else if (entry.locationName) detail = `<span class="text-gray-400"> 📍 ${entry.locationName.split(',')[0]}</span>`;

                    html += `<div class="${bg} ${border} p-2 rounded-lg flex items-center gap-2">
                        <span class="text-lg">${medals[i]}</span>
                        <div class="flex-1 min-w-0">
                            <span class="font-black text-${color}-600">${entry.steps.toLocaleString()}</span>
                            <span class="text-[10px] text-gray-400 ml-1">${dateStr}</span>
                            ${detail ? `<div class="text-[10px] truncate">${detail}</div>` : ''}
                        </div>
                    </div>`;
                });
                html += '</div>';
                el.innerHTML = html;
            });
        }

        // --- Interaction ---
        const modal = document.getElementById('modal-overlay');
        const showModal = (title, content, onConfirm, confirmText) => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = content;
            modal.classList.remove('hidden');
            const confirmBtn = document.getElementById('modal-confirm');
            const cancelBtn = document.getElementById('modal-cancel');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.textContent = confirmText || 'Save';
            cancelBtn.classList.toggle('hidden', !!confirmText);
            newConfirm.addEventListener('click', () => { onConfirm(); modal.classList.add('hidden'); });
            cancelBtn.onclick = () => modal.classList.add('hidden');
        };

        // Stash the log id when the camera button is clicked, so the file-input
        // change handler knows which log to attach the photo to.
        let pendingPhotoLogId = null;

        document.addEventListener('click', async e => {
            // Tap the truncated location line to see the full name in a modal.
            const locEl = e.target.closest('.show-location');
            if (locEl) {
                showModal('Location', `<p class="text-gray-700 break-words">📍 ${locEl.dataset.loc}</p>`, () => {}, 'Close');
                return;
            }
            // Clicking a thumbnail (log list) or popup photo (map) opens the lightbox.
            const photoEl = e.target.closest('.log-photo-thumb, .popup-photo');
            if (photoEl) {

        function setupStatsFilter() {
            const start = new Date(2025, 9, 1);
            const now = new Date();
            const filter = document.getElementById('stats-filter');
            let html = '<option value="all">All Time</option>';

            // Challenge years first — they're the meaningful unit now.
            const thisYear = currentChallengeYear();
            html += '<optgroup label="Challenge Years">';
            for (let n = 1; n <= thisYear; n++) {
                const s = challengeYearStart(n), e = challengeYearEnd(n);
                html += `<option value="year-${n}">Year ${n} (Oct ${String(s.getFullYear()).slice(2)}–Sep ${String(e.getFullYear()).slice(2)})</option>`;
            }
            html += '</optgroup>';

            let current = new Date(start);
            let currentYear = -1;
            while (current <= now || (current.getMonth() === now.getMonth() && current.getFullYear() === now.getFullYear())) {
                const y = current.getFullYear();
                const m = current.getMonth();
                const mName = current.toLocaleString('default', { month: 'short' });
                if (y !== currentYear) {
                    if (currentYear !== -1) html += '</optgroup>';
                    html += `<optgroup label="${y}">`;
                    currentYear = y;
                }
                html += `<option value="${y}-${m}">${mName} ${y}</option>`;
                current.setMonth(current.getMonth() + 1);
            }
            if (currentYear !== -1) html += '</optgroup>';
            filter.innerHTML = html;
            filter.addEventListener('change', updateUI);
        }

        async function handleStepSubmit(e) {
            e.preventDefault();
            if (!currentUser) return;
            const steps = parseInt(stepInput.value, 10);
            if (isNaN(steps) || steps <= 0) return;
            
            const oldSteps = totalSteps(currentUser);
            // Snapshot the annual total too — a backdated log only moves it if the date
            // actually falls inside the current challenge year.
            const oldAnnual = annualSteps[currentUser];
            const countsThisYear = getChallengeYear(selectedDate) === currentChallengeYear();

            stepInput.disabled = true;
            try {
                await runTransaction(db, async (t) => {
                    const uDoc = await t.get(currentUser === 'user1' ? user1DocRef : user2DocRef);
                    const newTotal = uDoc.data().steps + steps;
                    t.update(uDoc.ref, { steps: newTotal });
                    t.set(doc(logsCollectionRef), {
                        userId: currentUser, steps: steps, note: "", date: Timestamp.fromDate(selectedDate)
                    });
                });
                stepForm.reset();
                
                // Celebrations fire on *crossing*, checked here rather than on render —
                // so nothing can be missed depending on what happens to be on screen.
                const newSteps = oldSteps + steps;
                const newAnnual = oldAnnual + (countsThisYear ? steps : 0);

                const crossedAllTime = ALL_MILESTONES.filter(m => oldSteps < m.steps && newSteps >= m.steps);
                const crossedAnnual = countsThisYear
                    ? MASTER_MILESTONES.filter(m => oldAnnual < m.steps && newAnnual >= m.steps)
                    : [];

                if (crossedAllTime.length || crossedAnnual.length) {
                    confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 }, colors: currentUser === 'user1' ? ['#4ade80','#22c55e','#16a34a'] : ['#a855f7','#9333ea','#7e22ce'] });
                    setTimeout(() => confetti({ particleCount: 80, spread: 60, origin: { y: 0.7, x: 0.3 } }), 300);
                    setTimeout(() => confetti({ particleCount: 80, spread: 60, origin: { y: 0.7, x: 0.7 } }), 600);

                    const yr = currentChallengeYear();
                    const block = (m, caption) => `
                        <div class="text-center py-2">
                            <div class="text-4xl mb-3">${m.label.split(' ').pop()}</div>
                            <div class="text-lg font-bold mb-1">${m.label}</div>
                            <p class="text-gray-600 mb-2">${m.description}</p>
                            <p class="text-sm text-gray-400">${caption}</p>
                        </div>`;

                    let content = '';
                    if (crossedAnnual.length) {
                        const best = crossedAnnual[crossedAnnual.length - 1];
                        content += block(best, `${newAnnual.toLocaleString()} steps this year · Year ${yr}`);
                    }
                    if (crossedAllTime.length) {
                        const best = crossedAllTime[crossedAllTime.length - 1];
                        if (content) content += '<hr class="my-2 border-gray-200"><p class="text-center text-[10px] uppercase font-bold text-gray-400 mb-1">And on the all-time journey…</p>';
                        content += block(best, `${newSteps.toLocaleString()} steps all time`);
                    }

                    showModal('🎉 Milestone Reached!', content, () => {}, 'Nice! 🎉');
                }

                // Reset date to today after logging
                selectedDate = new Date();
                updateDateDisplay();
            } catch (err) { console.error(err); }
            finally { stepInput.disabled = false; }
        }

        // --- Setup ---
        function initializeMap() {
            map = L.map('map').setView([53.05, -3.0], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            markers = L.layerGroup().addTo(map);

            // Fullscreen toggle — moves the map and button to a body-level overlay
            // when expanded, so it's not trapped inside .main-container's
            // backdrop-filter (which would break position: fixed otherwise).
            const fsBtn = document.getElementById('map-fullscreen-btn');
            const wrapper = document.getElementById('map-wrapper');
            const mapEl = document.getElementById('map');
            const expandIcon = document.getElementById('map-fs-expand');
            const collapseIcon = document.getElementById('map-fs-collapse');
            let isMapFs = false;

            // Track exactly which inline props we set, so we can clear only ours
            // on collapse and leave any Leaflet-applied inline styles alone.
            const FS_MAP_PROPS  = ['width', 'height', 'borderRadius', 'boxShadow'];
            const FS_BTN_PROPS  = ['width', 'height', 'zIndex', 'background', 'border'];

            const setMapFullscreen = (on) => {
                isMapFs = on;
                if (on) {
                    let overlay = document.getElementById('map-fs-overlay');
                    if (!overlay) {
                        overlay = document.createElement('div');
                        overlay.id = 'map-fs-overlay';
                        Object.assign(overlay.style, {
                            position: 'fixed', top: '0', left: '0',
                            width: '100vw', height: '100vh',
                            zIndex: '99999', background: '#fff'
                        });
                        document.body.appendChild(overlay);
                    }
                    overlay.appendChild(mapEl);
                    overlay.appendChild(fsBtn);
                    Object.assign(mapEl.style, {
                        width: '100%', height: '100%',
                        borderRadius: '0', boxShadow: 'none'
                    });
                    Object.assign(fsBtn.style, {
                        width: '44px', height: '44px',
                        zIndex: '100000',
                        background: 'rgba(255,255,255,0.97)',
                        border: '1px solid rgba(0,0,0,0.12)'
                    });
                    document.body.style.overflow = 'hidden';
                } else {
                    // Clear ONLY the inline props we set — preserves Leaflet's own
                    // inline `position: relative` on the map container.
                    FS_MAP_PROPS.forEach(p => { mapEl.style[p] = ''; });
                    FS_BTN_PROPS.forEach(p => { fsBtn.style[p] = ''; });
                    // Move map and button back into the wrapper
                    wrapper.appendChild(mapEl);
                    wrapper.appendChild(fsBtn);
                    const overlay = document.getElementById('map-fs-overlay');
                    if (overlay) overlay.remove();
                    document.body.style.overflow = '';
                    // Force a reflow so Leaflet sees the new container size
                    void mapEl.offsetHeight;
                }
                expandIcon.classList.toggle('hidden', on);
                collapseIcon.classList.toggle('hidden', !on);
                fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Expand map');
                // Tell Leaflet the container size changed — multiple calls cover
                // the case where the first fires before layout has settled.
                requestAnimationFrame(() => map.invalidateSize());
                setTimeout(() => map.invalidateSize(), 100);
                setTimeout(() => map.invalidateSize(), 400);
            };

            fsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setMapFullscreen(!isMapFs);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isMapFs) setMapFullscreen(false);
            });
        }

        async function main() {

            if (sub) sub.textContent = `Year ${currentChallengeYear()} · Est. Oct 25`;

            // --- Real-time Listeners ---

            const logsQuery = query(logsCollectionRef, orderBy("date", "desc"));
            onSnapshot(logsQuery, (snapshot) => {
                logData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateUI();
                auditStepTotals();
            });
        }

        // --- 🔍 Data audit ---
        // Two numbers live in Firestore: the `challengeLogs` collection (every entry ever
        // added) and a `steps` counter on each user doc. The logs are the real record —
        // everything on screen is summed from them. The counter is just a running tally
        // kept in step by hand on each add and delete, and it has no history, so nothing
        // can prove *when* it drifted. What we can do is check the logs for anything that
        // would explain the size of the gap: a walk logged twice, an entry added straight
        // into the Firestore console, an entry with no date.
        //
        //   window.stepAudit()   → the full reconciliation, printed
        //   window.stepRepair()  → write the logs' total back over the counter

        const auditDayKey = (l) => {
            if (!l.date) return null;
            const d = l.date.toDate();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const auditDate = (l) => l.date
            ? l.date.toDate().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' })
            : 'no date';

        // Reconcile one person's logs against their stored counter, and hunt through the
        // logs for anything that accounts for the difference.
        function reconcileSteps(uid) {
            const name = (userData[uid] && userData[uid].name) || uid;
            const logs = logData.filter(l => l.userId === uid);
            const fromLogs = logs.reduce((t, l) => t + (Number(l.steps) || 0), 0);
            const stored = (userData[uid] && userData[uid].steps) || 0;
            const diff = stored - fromLogs; // negative → the logs hold steps the counter never got

            // Same person, same day, same step count: almost always one walk logged twice.
            const groups = {};
            logs.forEach(l => {
                const day = auditDayKey(l);
                if (day === null) return;
                const k = day + '|' + l.steps;
                (groups[k] = groups[k] || []).push(l);
            });
            const duplicates = Object.values(groups)
                .filter(g => g.length > 1)
                .map(g => ({
                    date: auditDate(g[0]), steps: g[0].steps, copies: g.length,
                    extra: (g.length - 1) * g[0].steps, ids: g.map(l => l.id).join(', ')
                }))
                .sort((a, b) => b.extra - a.extra);

            // Two entries on one day with *different* counts is perfectly normal (a morning
            // and an evening walk), but worth eyeballing when a total looks wrong.
            const sameDay = Object.values(
                logs.reduce((acc, l) => {
                    const day = auditDayKey(l);
                    if (day === null) return acc;
                    (acc[day] = acc[day] || []).push(l);
                    return acc;
                }, {})
            ).filter(g => g.length > 1 && new Set(g.map(l => l.steps)).size > 1)
             .map(g => ({ date: auditDate(g[0]), entries: g.length, steps: g.map(l => l.steps).join(' + '), total: g.reduce((t, l) => t + l.steps, 0) }));

            const undated  = logs.filter(l => !l.date);
            const oddSteps = logs.filter(l => !Number.isFinite(l.steps) || l.steps <= 0 || Math.floor(l.steps) !== l.steps);
            const outside  = logs.filter(l => {
                if (!l.date) return false;
                const d = l.date.toDate();
                return d < CHALLENGE_START || d > new Date();
            });

            // The counter is short by `gap`. What in the logs is exactly that size?
            const gap = -diff;
            const suspects = [];
            if (gap > 0) {
                // Anything already explained as a duplicate shouldn't be listed again on
                // its own further down.
                const claimed = new Set();
                duplicates.forEach(g => {
                    if (g.extra !== gap) return;
                    suspects.push(`The ${g.copies} identical entries of ${g.steps.toLocaleString()} on ${g.date} — the extra ${g.copies > 2 ? 'copies come' : 'copy comes'} to ${g.extra.toLocaleString()}, exactly the gap. (ids: ${g.ids})`);
                    g.ids.split(', ').forEach(id => claimed.add(id));
                });
                const dupTotal = duplicates.reduce((t, g) => t + g.extra, 0);
                if (duplicates.length > 1 && dupTotal === gap) {
                    suspects.push(`All ${duplicates.length} duplicate groups together come to ${dupTotal.toLocaleString()} — exactly the gap.`);
                    duplicates.forEach(g => g.ids.split(', ').forEach(id => claimed.add(id)));
                }
                logs.filter(l => l.steps === gap && !claimed.has(l.id)).forEach(l => {
                    suspects.push(l.date
                        ? `A single entry of ${gap.toLocaleString()} on ${auditDate(l)} matches the gap exactly — most likely added without the counter being updated. (id: ${l.id})`
                        : `A single undated entry of ${gap.toLocaleString()} matches the gap exactly. (id: ${l.id})`);
                });
            }

            return { uid, name, count: logs.length, fromLogs, stored, diff, gap,
                     duplicates, sameDay, undated, oddSteps, outside, suspects };
        }

        // Kept for the automatic on-load check — the short version.
        let auditWarned = false;
        function auditStepTotals() {
            const report = ['user1', 'user2'].map(uid => {
                const r = reconcileSteps(uid);
                return { user: r.name, uid: r.uid, stored: r.stored, fromLogs: r.fromLogs, diff: r.diff };
            });
            const bad = report.filter(r => r.diff !== 0);
            if (bad.length && !auditWarned) {
                auditWarned = true;
                console.warn('[A-to-A] The stored counter does not match the sum of the logs:', report,
                             '\nEverything on screen comes from the logs. Run window.stepAudit() for the breakdown.');
            }
            return report;
        }

        window.stepAudit = () => {
            const out = [];
            const say = (line) => out.push(line);
            say('');
            say('A-to-A · steps reconciliation');
            say('The logs are the record. The counter is a tally kept alongside them.');

            ['user1', 'user2'].forEach(uid => {
                const r = reconcileSteps(uid);
                say('');
                say('────────────────────────────────────────────────');
                say(`${r.name}`);
                say(`  Entries in the log      ${r.count.toLocaleString()}`);
                say(`  Sum of those entries    ${r.fromLogs.toLocaleString()}   ← what the app shows`);
                say(`  Stored counter          ${r.stored.toLocaleString()}`);

                if (r.diff === 0) {
                    say('  ✅ These match.');
                } else if (r.diff < 0) {
                    say(`  ⚠️  Gap: ${r.gap.toLocaleString()} steps are in the logs but never reached the counter.`);
                    say('      (Nothing is missing from Firestore — the logs ARE the Firestore record.');
                    say('       The counter simply missed some increments.)');
                } else {
                    say(`  ⚠️  Gap: the counter is ${r.diff.toLocaleString()} steps AHEAD of the logs.`);
                    say('      That direction means entries were removed without the counter coming down —');
                    say('      usually a delete done straight in the Firestore console.');
                }

                if (r.suspects.length) {
                    say('');
                    say('  What accounts for it:');
                    r.suspects.forEach(x => say(`   • ${x}`));
                } else if (r.diff !== 0) {
                    say('');
                    say('  Nothing in the logs matches the gap exactly, so it is likely several');
                    say('  missed increments rather than one event. The counter keeps no history,');
                    say('  so it cannot be pinned down further.');
                }

                const notes = [];
                if (r.duplicates.length) notes.push(`${r.duplicates.length} duplicate group(s) — same day, same step count`);
                if (r.sameDay.length)    notes.push(`${r.sameDay.length} day(s) with several different entries (normal, but worth a look)`);
                if (r.undated.length)    notes.push(`${r.undated.length} entr(y/ies) with no date`);
                if (r.oddSteps.length)   notes.push(`${r.oddSteps.length} entr(y/ies) with a zero, negative or fractional step count`);
                if (r.outside.length)    notes.push(`${r.outside.length} entr(y/ies) dated before the challenge started or in the future`);
                say('');
                say(notes.length ? '  Worth checking:' : '  No duplicates, undated entries or odd step counts found.');
                notes.forEach(n => say(`   • ${n}`));
            });

            say('');
            say('Run window.stepRepair() to write the logs\' total over the counter.');
            say('');
            console.log(out.join('\n'));

            // Tables for anything found, so rows can be clicked into and inspected.
            ['user1', 'user2'].forEach(uid => {
                const r = reconcileSteps(uid);
                if (r.duplicates.length) { console.log(`${r.name} — duplicate entries (same day, same count):`); console.table(r.duplicates); }
                if (r.sameDay.length)    { console.log(`${r.name} — days with several entries:`); console.table(r.sameDay); }
                if (r.undated.length)    { console.log(`${r.name} — entries with no date:`); console.table(r.undated.map(l => ({ id: l.id, steps: l.steps, note: l.note || '' }))); }
                if (r.oddSteps.length)   { console.log(`${r.name} — odd step counts:`); console.table(r.oddSteps.map(l => ({ id: l.id, date: auditDate(l), steps: l.steps }))); }
                if (r.outside.length)    { console.log(`${r.name} — dated outside the challenge:`); console.table(r.outside.map(l => ({ id: l.id, date: auditDate(l), steps: l.steps }))); }
            });

            return ['user1', 'user2'].map(reconcileSteps);
        };

        // Manual, deliberate reconciliation — the logs are the source of truth, so this
        // just stamps their total onto the counter.
        window.stepRepair = async () => {
            const report = auditStepTotals().filter(r => r.diff !== 0);
            if (!report.length) { console.log('[A-to-A] The counter already matches the logs — nothing to do.'); return; }
            for (const r of report) {
                await updateDoc(r.uid === 'user1' ? user1DocRef : user2DocRef, { steps: r.fromLogs });
                console.log(`[A-to-A] ${r.user}: counter ${r.stored.toLocaleString()} → ${r.fromLogs.toLocaleString()}`);
            }
        };

        main();

    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
